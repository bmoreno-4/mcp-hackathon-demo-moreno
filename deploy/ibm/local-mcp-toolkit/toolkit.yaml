# watsonx Orchestrate LOCAL MCP toolkit import config.
#
# DO NOT import this file directly. Use the register script:
#   bash deploy/ibm/local-mcp-toolkit/register-toolkit.sh
#
# The register script builds a minimal, self-contained staging directory with a
# FLATTENED layout — `lrl_reservoirs/` and `server.py` sit directly at
# package_root (no src/ prefix), plus a pinned requirements.txt — then rewrites
# `package_root` to point at it before calling `orchestrate toolkits import`.
# This keeps the upload tiny, avoids a 413 "Request Entity Too Large" from
# uploading the whole repo, and makes `lrl_reservoirs` importable at runtime.
#
# Orchestrate uploads package_root, installs requirements.txt, and runs `command`
# over stdio. `python server.py` imports `lrl_reservoirs.app:mcp` and runs it.
#
# This server needs NO credentials, so no `connections` are declared.
# If your server needs secrets, add a connection (see README) and list it here.
spec_version: v1
kind: mcp
name: lrl_reservoirs_moreno
description: "MCP server for USACE Louisville District (LRL) reservoir conditions. Exposes get_lake_conditions (single lake), summarize_district_lakes (district-wide snapshot), list_lakes (lake directory), get_lake_trend (change over 1-14 days) and check_against_daily_report (live values vs. today's LRL Daily Lake Report) backed by the CWMS Data API and the LRL report page. Data matches the LRL Daily Lake Report."
command: python server.py
env: []
tools:
  - "*"
# Placeholder — the register script overwrites this with the staging dir path.
package_root: ./_stage
